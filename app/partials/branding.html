  }

  .events-banner {
    padding: 0;
    margin: 0;
    margin-bottom: 20%;
  }

  .caption {
    color: black;
    text-align: center;
    margin: auto;
  }

  .captionText {
    font-size: 3.333rem;
    line-height: 1.1;
    font-style: normal;
    font-weight: 700;
    font-size: 30px;
  }

  .nav-line {
    border-bottom: 2px solid black;
  }

    .caption-home-mobile {
    text-align: center;
    border-radius: 40px;
    padding: 30px;
    position: relative;
    bottom: 25px;
    z-index: 9999;
    background: white;
    width: 90%;
    margin: auto;
  }

  .captionText-home {
		font-size: 18px;
    padding: 0 100px;

  .secondText-home {
		font-size: 40px;
		line-height: 45px;
		color: #01517D;
		font-weight: 600;
		margin-bottom: 25px;
		padding: 0 70px;
	}

  .caption-button {
    align-items: center;
    background-color: #e81c2d;
    border: 0px;
    border-color: 1px #e81c2d;
    border-radius: 5px;
    box-sizing: border-box;
    color: white;
    display: flex;
    font-size: 15px;
    font-stretch: normal;
    font-style: normal;
    font-weight: bold;
    justify-content: center;
    letter-spacing: 1.35px;
    line-height: normal;
    margin-top: 1rem;
    min-height: 48px;
    padding: 16px 32px;
    text-align: center;
    text-decoration: none;
    text-transform: uppercase;
    vertical-align: middle;
    width: 265px;
    margin: auto;
  }

  .caption-button:hover {
    /*background-color: #a7111d;
    border-color: #a7111d;*/
    background-color: #D4E9E6;
    border-color: #e81c2d;
    color: black;
    text-decoration: none;
  }

  .angle-text {
    position: absolute;
    top: 60%;
    left: 50%;
    transform: translate(-50%, -35%);
    color: white;
    font-weight: bold;
    width: fit-content;
    text-shadow: 0 0 8px rgba(0, 0, 0, .35);
    text-align: center;
  }

  .angle-caption-text {
    width: max-content;
    font-size: 30px;
  }

  .angleDiv-home {
    border-left: 100vw solid black;
    height: 100px;
    border-top: 0 solid transparent;
    border-bottom: 10rem solid transparent;
  }

  .angleDiv {
    border-left: 100vw solid black;
    height: 100px;
    border-top: 0 solid transparent;
    border-bottom: 10rem solid transparent;
  }
  .logo-text {
    margin-bottom: 5px;
    margin-top: 20px;
    font-size: 12px;
  }
  .tp-logo {
    width: 15%;
    margin: auto;
  }

  .caption-home {
    padding-top: 24%;
  }
 
 .caption {
  position: absolute;
  top: 50%;
  left: 25%;
  transform: translate(-50%, -50%);
  color: white;
  width: fit-content;
  text-align: left;

}

 .captionText {
    font-size: 1rem;
    letter-spacing: .13rem;
    line-height: calc(1 + .2 / var(--font-body-scale));
    text-transform: uppercase;
  }
.captionTextBody  {
    margin: auto;
}
.btn-caption {
    font-size: 15px;
    color: rgb(220, 68, 5);
    background: white;
    padding: 15px 35px;
    border-radius: 8px;
}
.btn-caption:hover {
    color: white;
    background: rgb(220, 68, 5);
    text-decoration: none;
}
.btn-caption-mobile {
    font-size: 15px;
    color: rgb(220, 68, 5);
    background: white;
    padding: 15px 35px;
    border-radius: 8px;
}
.btn-caption-mobile:hover {
    color: white;
    background: #00263e;
    text-decoration: none;
}
.captionTextMobile {
    margin: 0;
    padding-top: 30px;
    color: white;
    font-size: 1rem;
    letter-spacing: .13rem;
    line-height: calc(1 + .2 / var(--font-body-scale));
    text-transform: uppercase;
}

}

    .captionText-home {
